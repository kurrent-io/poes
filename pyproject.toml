[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poes"
version = "0.3.0"
description = "Proof-Oriented Event Sourcing — verify aggregates using property-based testing and state exploration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["hypothesis>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/kurrent-io/poes"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
kurrentdb = ["kurrentdbclient>=1.0"]

[tool.pytest.ini_options]
markers = ["integration: requires running KurrentDB"]

[tool.hatch.build.targets.wheel]
packages = ["src/poes"]
